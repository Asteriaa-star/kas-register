name: Keep Alive

# Menjaga server Render (free tier) tetap bangun dengan ping tiap 10 menit.
# Ping ini juga membuat repo tetap "aktif" agar jadwal tidak dimatikan GitHub.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping aplikasi
        run: |
          URL="${{ vars.APP_URL }}"
          if [ -z "$URL" ]; then
            echo "APP_URL belum diisi di repo Variables. Lewati."
            exit 0
          fi
          echo "Pinging $URL"
          curl -sS -m 60 -o /dev/null -w "HTTP %{http_code} dalam %{time_total}s\n" "$URL/up" || true
